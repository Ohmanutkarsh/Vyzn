<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cameras — VYZN</title>
  <link rel="stylesheet" href="/static/tokens.css">
  <link rel="stylesheet" href="/static/components/ui.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="app-shell">

  <!-- Desktop Sidebar -->
  <div id="app-sidebar"></div>

  <!-- Main Content Wrapper -->
  <div class="shell-main-wrapper">
    <!-- Top Header -->
    <div id="app-header"></div>

    <!-- Cameras Content -->
    <main class="shell-content" id="main-content">
      <!-- Cameras Header Row -->
      <div class="cameras-header-row" style="margin-bottom: var(--space-4, 16px); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;">
        <div>
          <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
            <h2 style="font-size: 20px; font-weight: 600; margin: 0;" id="txt-cameras-title">Cameras</h2>
            <span id="badge-cameras-quota" style="font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 9999px; background: rgba(113, 113, 122, 0.2); color: #d4d4d8; border: 1px solid rgba(113, 113, 122, 0.3);">
              Loading quota…
            </span>
          </div>
          <span style="font-size: 13px; color: var(--text-2); margin-top: 4px; display: block;" id="txt-cameras-count">Loading cameras…</span>
        </div>
        <div style="display: flex; align-items: center; gap: 10px;">
          <a href="/settings#camera-plan" class="btn btn-secondary" style="font-size: 13px; padding: 7px 14px; text-decoration: none; display: inline-flex; align-items: center; gap: 6px;" id="btn-manage-plan">
            💳 Camera Plan
          </a>
          <a href="/cameras/new" class="btn btn-primary" id="btn-add-camera" style="text-decoration: none; font-size: 13px; padding: 7px 16px;">+ Add camera</a>
        </div>
      </div>

      <!-- Camera Quota Summary Widget -->
      <div id="cameras-quota-card" style="margin-bottom: var(--space-6, 24px); padding: 14px 18px; border-radius: 12px; background: rgba(24, 24, 27, 0.85); border: 1px solid #27272a; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px;">
        <div style="display: flex; align-items: center; gap: 14px; flex-wrap: wrap;">
          <div style="display: flex; align-items: center; gap: 8px;">
            <span style="font-size: 18px;">📹</span>
            <span style="font-size: 13.5px; font-weight: 600; color: #ffffff;" id="txt-quota-headline">Camera Quota:</span>
          </div>
          <div style="display: flex; align-items: center; gap: 14px; font-size: 13px; flex-wrap: wrap;">
            <div>
              <span style="color: #71717a;">Purchased:</span>
              <strong style="color: #ffffff; margin-left: 4px;" id="val-cameras-purchased">—</strong>
            </div>
            <div style="color: #3f3f46;">|</div>
            <div>
              <span style="color: #71717a;">Active:</span>
              <strong style="color: #a1a1aa; margin-left: 4px;" id="val-cameras-used">—</strong>
            </div>
            <div style="color: #3f3f46;">|</div>
            <div>
              <span style="color: #71717a;">Remaining:</span>
              <strong style="color: #10b981; margin-left: 4px;" id="val-cameras-available">—</strong>
            </div>
          </div>
        </div>
        <div style="font-size: 12.5px; color: #a1a1aa;" id="txt-quota-note">
          Checking plan quota…
        </div>
      </div>

      <!-- Cameras Grid / List -->
      <div class="cameras-grid" id="cameras-grid">
        <!-- Rendered dynamically -->
        <div class="skeleton" style="height: 280px; border-radius: var(--radius-panel);"></div>
        <div class="skeleton" style="height: 280px; border-radius: var(--radius-panel);"></div>
      </div>
    </main>

    <!-- Mobile Bottom Navigation -->
    <div id="app-bottom-nav"></div>
  </div>

  <!-- Remove Camera Confirmation Modal (Section 6.5) -->
  <div class="modal-scrim" id="modal-remove" style="display: none;" role="dialog" aria-modal="true" aria-labelledby="modal-remove-title">
    <div class="modal-card">
      <h3 class="modal-title" id="modal-remove-title">Remove camera?</h3>
      <p class="modal-body" id="modal-remove-body">Its saved footage and clips will be deleted now.</p>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" id="btn-cancel-remove">Cancel</button>
        <button type="button" class="btn btn-danger" id="btn-confirm-remove">Remove and delete</button>
      </div>
    </div>
  </div>

  <!-- Rename Camera Modal -->
  <div class="modal-scrim" id="modal-rename" style="display: none;" role="dialog" aria-modal="true" aria-labelledby="modal-rename-title">
    <div class="modal-card">
      <h3 class="modal-title" id="modal-rename-title">Rename camera</h3>
      <div class="form-group" style="margin-top: var(--space-3); margin-bottom: 0;">
        <label for="input-rename-name" class="form-label">Camera name</label>
        <input type="text" id="input-rename-name" class="form-input" autocomplete="off" />
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" id="btn-cancel-rename">Cancel</button>
        <button type="button" class="btn btn-primary" id="btn-confirm-rename">Save</button>
      </div>
    </div>
  </div>

  <script type="module" src="/static/cameras.js?v=2.6"></script>
</body>
</html>
